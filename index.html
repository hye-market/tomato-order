<style>
:root{
  --bg:#0e1320;--card:#151c2b;--card2:#1c2537;--border:#283247;--text:#ece6d8;--muted:#8a93a8;
  --primary:#d9a92e;--primary-ink:#1a1306;--success:#3cbf7c;--danger:#e5534b;--warn:#e7a33a;
  --shadow:0 6px 24px rgba(0,0,0,.25);
}
body.light{
  --bg:#f6f4ef;--card:#ffffff;--card2:#f2efe7;--border:#e2dccd;--text:#1d2230;--muted:#6b7280;
  --shadow:0 4px 18px rgba(30,30,40,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:calc(48px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.container{max-width:1280px;margin:0 auto;padding:0 12px}
@media(min-width:640px){.container{padding:0 18px}}

/* header */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.hbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;padding:8px 0}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand svg{width:22px;height:22px;flex:none;color:var(--primary)}
.brand h1{margin:0;font-family:Montserrat,"Noto Sans KR",sans-serif;font-weight:800;font-size:16px;letter-spacing:.02em;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
@media(min-width:640px){.brand h1{font-size:20px}.brand svg{width:28px;height:28px}}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.badge.live{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.badge.local{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.hbtns{display:flex;flex-wrap:wrap;gap:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:12.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--card2)}
.btn svg{width:15px;height:15px}
.btn.sm{height:28px;padding:0 8px;font-size:12px}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:700}
.btn.primary:hover{filter:brightness(1.07);background:var(--primary)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.danger:hover{filter:brightness(1.07);background:var(--danger)}
.btn.ghost{border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .lbl{display:none}
@media(min-width:640px){.btn .lbl{display:inline}}
.btn.always .lbl{display:inline}

main{display:flex;flex-direction:column;gap:12px;margin-top:12px}
@media(min-width:640px){main{gap:20px;margin-top:20px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:12px}
@media(min-width:640px){.pad{padding:18px}}
.ttl{margin:0;font-size:15px;font-weight:700;color:var(--primary)}
@media(min-width:640px){.ttl{font-size:17px}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.notice{border:1px dashed color-mix(in srgb,var(--primary) 50%,transparent);background:color-mix(in srgb,var(--primary) 8%,transparent);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:640px){.metrics{gap:14px}}
.metric{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:14px;padding:10px 12px}
@media(min-width:640px){.metric{padding:16px 18px}}
.metric .lab{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:4px}
@media(min-width:640px){.metric .lab{font-size:13px}}
.metric .val{font-weight:800;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:640px){.metric .val{font-size:24px}}
.metric .sub{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.35}
@media(min-width:640px){.metric .sub{font-size:11px}}
.c-primary{color:var(--primary)}.c-success{color:var(--success)}.c-danger{color:var(--danger)}

/* form */
.formgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:1024px){.formgrid{grid-template-columns:1fr 280px}}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:end}
@media(min-width:640px){.fields{grid-template-columns:repeat(4,1fr);gap:12px}}
@media(min-width:900px){.fields{grid-template-columns:1.3fr 1.3fr 1fr .8fr 1fr auto auto 1fr}}
#fSubmit{grid-column:span 2}
@media(min-width:900px){#fSubmit{grid-column:auto}}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.inp{width:100%;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card2);padding:0 10px;outline:none}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 22%,transparent)}
.inp.sm{height:30px;font-size:12px;padding:0 6px}
textarea.inp{height:auto;padding:8px 10px;resize:none}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;height:36px;user-select:none}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;margin:0}
.ring{position:relative;width:36px;height:36px;border-radius:50%;flex:none}
.ring i{position:absolute;inset:4px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:9px;font-style:normal;font-weight:700;color:var(--primary)}
.memo{display:flex;flex-direction:column}
.memo textarea{flex:1;min-height:96px;margin-top:10px}

/* calendar */
.calwrap{position:relative}
.cal{position:absolute;top:38px;left:0;z-index:30;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:10px;width:270px}
.cal .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:700}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dow{font-size:11px;color:var(--muted);padding:4px 0}
.cal .d{height:32px;border-radius:7px;border:none;background:transparent;cursor:pointer;font-size:13px}
.cal .d:hover{background:var(--card2)}
.cal .d.has{color:var(--primary);font-weight:800}
.cal .d.has::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:var(--primary);margin:-3px auto 0}
.cal .d.sel{background:var(--primary);color:var(--primary-ink)}
.cal .d.sel::after{background:var(--primary-ink)}
.cal .d.today{outline:1px solid var(--primary)}

/* table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:740px;font-size:12.5px}
@media(min-width:640px){table{font-size:13.5px}}
th{background:color-mix(in srgb,var(--card2) 70%,transparent);color:var(--muted);font-weight:500;padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);white-space:nowrap}
tr:hover td{background:color-mix(in srgb,var(--card2) 50%,transparent)}
.r{text-align:right}.c{text-align:center}
td.amt{color:var(--primary);font-weight:600}
.ib{width:28px;height:28px;border:none;background:transparent;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ib:hover{background:var(--card2)}
.ib svg{width:15px;height:15px}
.empty{padding:34px;text-align:center;color:var(--muted)}

/* panels */
.g3{display:grid;grid-template-columns:1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
@media(min-width:768px){.stack{gap:18px}}
.g2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:768px){.g3{grid-template-columns:repeat(3,1fr);gap:18px}.g2{grid-template-columns:repeat(2,1fr);gap:18px}}
.list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:9px;background:color-mix(in srgb,var(--card2) 70%,transparent);border:1px solid transparent}
.item.checked{background:color-mix(in srgb,var(--primary) 16%,transparent);border-color:color-mix(in srgb,var(--primary) 60%,transparent)}
.item .l{display:flex;align-items:center;gap:8px;min-width:0}
.item .n{font-size:11px;color:var(--muted);width:20px;flex:none}
.item .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v{font-weight:700;color:var(--primary);white-space:nowrap}
.more{width:100%;margin-top:6px;height:30px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;border-radius:8px}
.more:hover{background:var(--card2)}
.grade{font-size:11.5px}

/* chart */
.chart svg{width:100%;height:auto;display:block;margin-top:10px}
.chart text{fill:var(--muted);font-size:11px}

/* toast / modal / busy */
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:420px}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--success);box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px 14px;border-radius:10px;font-size:13px;width:100%;animation:tin .2s ease-out}
.toast.err{border-left-color:var(--danger);color:color-mix(in srgb,var(--danger) 70%,var(--text))}
.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;background:rgba(5,8,15,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45);width:100%;max-width:420px;padding:20px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{margin:0 0 14px;color:var(--muted);white-space:pre-line;line-height:1.55;font-size:13.5px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--text)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{min-height:70vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--muted)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lgcard{width:100%;max-width:360px;padding:30px 24px;text-align:center;display:flex;flex-direction:column;gap:10px}
.lgcard h1{margin:6px 0 0;font-family:Montserrat,"Noto Sans KR",sans-serif;font-weight:800;font-size:26px;color:var(--primary);letter-spacing:.02em}
.lglogo{width:44px;height:44px;color:var(--primary);margin:0 auto}
.lgcard .inp{height:46px;font-size:16px}
.madeby{text-align:center;font-weight:700;color:inherit;font-size:13px;padding:14px 0 18px;letter-spacing:-.2px}
.pvlink{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:400;color:var(--muted);text-decoration:underline}
.pwwarn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px auto 0;max-width:1200px;padding:10px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);background:color-mix(in srgb,var(--danger) 10%,transparent);font-size:13px}
.pwwarn b{color:var(--danger)}
.lgerr{color:var(--danger);font-size:13px;min-height:18px;line-height:1.5}
.linkbtn{background:none;border:none;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.linkbtn:hover{color:var(--primary)}
.hide{display:none!important}
.mob-only{display:none!important}
/* ── 휴대폰 ── */
@media(max-width:700px){
  .desk-only{display:none!important}
  .mob-only{display:inline-flex!important}
  .inp,select.inp,textarea.inp{font-size:16px}           /* 아이폰 입력 시 화면 확대 방지 */
  .inp{height:42px}
  input[type=checkbox]{width:22px;height:22px}
  .btn{height:36px}
  .btn.sm{height:34px}
  .chk{height:42px;font-size:14px}
  .ib{width:36px;height:36px}
  .hbtns .btn{width:38px;padding:0}
  .modal{padding:16px;border-radius:14px}
  .overlay{align-items:flex-end;padding:0}
  .overlay .modal{max-width:100%!important;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  #toasts{bottom:calc(14px + env(safe-area-inset-bottom))}
}
/* 휴대폰 주문 카드 */
.ocards{display:flex;flex-direction:column}
.ocard{padding:12px;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent);display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.ocard.sel{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.ocard .who{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:baseline;min-width:0}
.ocard .who small{font-weight:400;color:var(--muted);font-size:12px}
.ocard .what{grid-column:2/3;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .money{grid-column:3/4;grid-row:1/3;text-align:right;font-weight:800;color:var(--primary);font-size:15px}
.ocard .money small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ocard .acts{grid-column:2/4;display:flex;gap:8px;align-items:center;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border);font-size:13px;cursor:pointer;user-select:none}
.pill.on{background:color-mix(in srgb,var(--success) 18%,transparent);border-color:var(--success);color:var(--success);font-weight:700}
.pill.card.on{background:color-mix(in srgb,var(--primary) 18%,transparent);border-color:var(--primary);color:var(--primary)}
.pill input{display:none}
.ro #formCard input,.ro #tableWrap input,.ro button.w{pointer-events:none;opacity:.5}
</style>
</head>

<script>
(() => {
"use strict";
/* ───────── helpers ───────── */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = (n) => (n == null || isNaN(n) ? 0 : Number(n)).toLocaleString("ko-KR") + "원";
const pad = (n) => String(n).padStart(2, "0");
const toShort = (d) => `${String(d.getFullYear()).slice(2)}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toFull = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const shortToFull = (s) => { const p = String(s).split("-"); return p.length === 3 ? `20${p[0]}-${p[1]}-${p[2]}` : ""; };
const fullToShort = (s) => s ? s.slice(2) : "";
let collator; try { collator = new Intl.Collator("ko"); } catch { collator = null; }
const cmp = (a, b) => collator ? collator.compare(a || "", b || "") : String(a || "").localeCompare(String(b || ""));
const amt = (o) => (Number(o.quantity) || 0) * (Number(o.unitPrice) || 0);
const monthOf = (short) => { const p = String(short).split("-"); return p.length >= 2 ? `${p[0]}-${p[1]}` : ""; };
const isCurrentMonth = (short) => { const p = String(short).split("-"); if (p.length !== 3) return false; const n = new Date(); return 2000 + Number(p[0]) === n.getFullYear() && Number(p[1]) - 1 === n.getMonth(); };
const curMonthKey = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}`; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function nameKey(name) {
  const b = new TextEncoder().encode(String(name));
  let h = "c"; for (const x of b) h += x.toString(16).padStart(2, "0");
  if (h.length > 180) { let x = 0; for (const c of h) x = (x * 31 + c.charCodeAt(0)) >>> 0; h = h.slice(0, 170) + "_" + x.toString(36); }
  return h;
}
const TRASH_DAYS = 30;
const COLORS = { gold: "#d9a92e", pink: "#e8709a", mint: "#2fb59a", blue: "#3b82f6", green: "#2e9e4f", purple: "#8b5cf6", coral: "#f0705a" };
const INKS = { gold: "#1a1306", pink: "#2a0612", mint: "#03201a", blue: "#ffffff", green: "#ffffff", purple: "#ffffff", coral: "#2a0a04" };
const DEFAULT_TEMPLATE = "{고객}님 안녕하세요 😊\n{날짜} 주문하신 내역이에요.\n{내역}\n\n총 {금액} 입금 부탁드려요 🙏\n{계좌}";
const DEFAULT_YEAR_TEMPLATE = "{고객}님 안녕하세요.\n거파금액이 확인되어 앞으로 거래가 제한됨을 알려드립니다.\n\n{내역}\n\n거파금액 합계: {금액}\n{계좌}";
const DEFAULT_CONFIG = { storeName: "", color: "gold", profitRate: 20, vipLine: 500000, cardFee: 0, shipFee: 0, packFee: 0, bank: "", account: "", holder: "", template: DEFAULT_TEMPLATE, templateYear: DEFAULT_YEAR_TEMPLATE };

/* ───────── state ───────── */
const S = {
  orders: [], custArchive: [], salesRaw: [], memos: {}, costs: {}, trash: [], customers: {}, isOwner: false, role: "", loginId: "", config: { ...DEFAULT_CONFIG }, configLoaded: false,
  dateFilter: toShort(new Date()), formDate: toFull(new Date()), calMonth: null,
  showAll: false, search: "", selected: new Set(), editingId: null, editData: {},
  expanded: {}, mode: "loading", firstLoadDone: false, canWrite: true, statementCustomer: "",
};
let downloadsP = null;
const CFG = window.LIVE_ORDER_CONFIG || {};
let sb = null, SHOP = null, channel = null;

/* ───────── storage layer: 수파베이스 (업체별로 분리된 데이터) ───────── */
const fromOrder = (r) => ({ id: r.id, date: r.date, customerName: r.customer_name, productNumber: r.product_number || "", size: r.size || "", quantity: Number(r.quantity) || 0, unitPrice: Number(r.unit_price) || 0, isPaid: !!r.is_paid, isCard: !!r.is_card, createdAt: Number(r.created_at) || 0 });
function toOrder(o) {
  const r = {};
  if ("date" in o) r.date = o.date;
  if ("customerName" in o) r.customer_name = o.customerName;
  if ("productNumber" in o) r.product_number = o.productNumber || "";
  if ("size" in o) r.size = o.size || "";
  if ("quantity" in o) r.quantity = Number(o.quantity) || 0;
  if ("unitPrice" in o) r.unit_price = Number(o.unitPrice) || 0;
  if ("isPaid" in o) r.is_paid = !!o.isPaid;
  if ("isCard" in o) r.is_card = !!o.isCard;
  if ("createdAt" in o) r.created_at = Number(o.createdAt) || Date.now();
  return r;
}
async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
async function selectAll(table, order, filter) {
  const out = []; let from = 0;
  for (;;) {
    let qq = sb.from(table).select("*").range(from, from + 999);
    if (filter) qq = filter(qq);
    if (order) qq = qq.order(order, { ascending: true });
    const d = await q(qq); out.push(...(d || []));
    if (!d || d.length < 1000) break; from += 1000;
  }
  return out;
}
const RANGE_KEY = "lo-load-range";
function rangeMonths() { const v = lsGet(RANGE_KEY, "3"); return v === "all" ? 0 : Number(v) || 0; }
function rangeCutoff() {
  const n = rangeMonths(); if (!n) return null;
  const d = new Date(); const c = new Date(d.getFullYear(), d.getMonth() - (n - 1), 1);
  return toShort(c);
}
let usageT = 0;
async function loadUsage(force) {
  if (!force && Date.now() - usageT < 30000) return; usageT = Date.now();
  try { const u = await q(sb.rpc("storage_usage")); if (u) { S.usage = u; renderSoon(); } } catch (e) { console.warn("storage_usage 없음", e); }
}
async function ensureAllLoaded(reason) {
  if (S.allLoaded || !S.cutoff) return;
  busy(reason || "전체 주문 불러오는 중");
  try { S.allLoaded = true; await loaders.orders(); render(); toast("지난 주문까지 모두 불러왔어요"); }
  finally { busy(null); }
}
const chunk = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; };
const loaders = {
  orders: async () => {
    const cut = S.allLoaded ? null : rangeCutoff();
    S.cutoff = cut;
    S.orders = (await selectAll("orders", "created_at", cut ? (qq) => qq.gte("date", cut) : null)).map(fromOrder);
    // 불러오지 않은 지난 주문은 서버에서 고객별 합계만 받아와요 (총 누적 합계가 정확하도록)
    const older = {}; let olderCount = 0;
    if (cut) {
      try { (await q(sb.rpc("order_totals_before", { cutoff: cut }))).forEach((r) => { older[r.customer_name] = Number(r.total) || 0; olderCount += Number(r.cnt) || 0; }); }
      catch (e) { console.warn("order_totals_before 없음", e); }
    }
    S.olderTotals = older; S.olderCount = olderCount;
    loadUsage(); loadYearUnpaid();
  },
  customer_totals: async () => { S.custArchive = (await selectAll("customer_totals")).map((r) => ({ customerName: r.customer_name, total: Number(r.total) || 0 })); },
  sales_archive: async () => { S.salesRaw = (await selectAll("sales_archive")).map((r) => ({ monthKey: r.month_key, day: Number(r.day), total: Number(r.total) || 0 })); },
  memos: async () => { const m = {}; (await selectAll("memos")).forEach((r) => { m[r.date] = r.text || ""; }); S.memos = m; },
  product_costs: async () => { const m = {}; (await selectAll("product_costs")).forEach((r) => { m[r.product] = Number(r.cost) || 0; }); S.costs = m; },
  trash: async () => { S.trash = (await selectAll("trash")).map((r) => ({ ...fromOrder(r), deletedAt: Number(r.deleted_at) || 0 })); },
  customers: async () => { const m = {}; (await selectAll("customers")).forEach((r) => { m[r.name] = { phone: r.phone || "", address: r.address || "", memo: r.memo || "" }; }); S.customers = m; },
  shop_config: async () => { const d = await q(sb.from("shop_config").select("*").maybeSingle()); S.config = { ...DEFAULT_CONFIG, ...((d && d.data) || {}) }; S.configLoaded = true; },
};
const TABLES = Object.keys(loaders);
const W = { dirty: new Set(), t: null };
function touch(...tables) {
  tables.forEach((t) => W.dirty.add(t)); clearTimeout(W.t);
  W.t = setTimeout(async () => { const ts = [...W.dirty]; W.dirty.clear(); try { await Promise.all(ts.map((t) => loaders[t]())); } catch (e) { console.error(e); } renderSoon(); }, 250);
}
// 실시간: 다른 기기에서 바뀐 주문 한 건만 받아서 고쳐요 (전체 다시 받기 X)
function patchOrderEvent(p) {
  const ev = p && p.eventType; const row = ev === "DELETE" ? p.old : p && p.new;
  const id = row && row.id;
  if (!id) { touch("orders"); return; }
  const i = S.orders.findIndex((o) => o.id === id);
  if (ev === "DELETE") { if (i >= 0) { S.orders.splice(i, 1); renderSoon(); } else if (S.cutoff && !S.allLoaded) touch("orders"); return; }
  if (row.shop_id && SHOP && row.shop_id !== SHOP) return;
  if (S.cutoff && !S.allLoaded && String(row.date) < S.cutoff) { touch("orders"); return; }
  const n = fromOrder(row);
  if (i >= 0) {
    const c = S.orders[i];
    // 내 기기에서 이미 반영한 변경이 되돌아온 경우: 같으면 다시 그리지 않아요
    if (c.date === n.date && c.customerName === n.customerName && c.productNumber === n.productNumber && c.size === n.size && c.quantity === n.quantity && c.unitPrice === n.unitPrice && c.isPaid === n.isPaid && c.isCard === n.isCard) return;
    S.orders[i] = n;
  } else S.orders.push(n);
  renderSoon();
}
const api = {
  async addOrder(o) {
    const d = await q(sb.from("orders").insert({ shop_id: SHOP, ...toOrder(o) }).select().single());
    const n = fromOrder(d); if (!S.orders.some((x) => x.id === n.id)) S.orders.push(n); renderSoon(); loadUsage(); return n;
  },
  async addOrders(list, label) {
    const parts = chunk(list, 300); let done = 0;
    for (const part of parts) { if (label) busy(`${label} (${done}/${list.length})`); await q(sb.from("orders").insert(part.map((o) => ({ shop_id: SHOP, ...toOrder(o) })))); done += part.length; }
    touch("orders");
  },
  async updateOrder(id, u) {
    await q(sb.from("orders").update(toOrder(u)).eq("id", id));
    const o = S.orders.find((x) => x.id === id); if (o) Object.assign(o, u); renderSoon();
  },

function modal({ title, message = "", okText = "확인", cancelText = "취소", danger = false, requireText = null, bodyHTML = "", onMount = null, validate = null }) {
  return new Promise((resolve) => {
    const root = $("#modalRoot");
    root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ""}${bodyHTML}

    </div></div>`;
    const ok = $("#mOk"), req = $("#mReq");
    const close = (v) => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); resolve(v); };
    const check = () => { if (req) ok.disabled = req.value.trim() !== requireText; };
    const onKey = (e) => { if (e.key === "Escape") close(false); if (e.key === "Enter" && !ok.disabled && e.target.tagName !== "TEXTAREA") ok.click(); };
    if (req) { req.addEventListener("input", check); check(); setTimeout(() => req.focus(), 30); } else setTimeout(() => ok.focus(), 30);
    ok.onclick = () => { const v = validate ? validate() : true; if (v === false) return; close(v); };
    if ($("#mNo")) $("#mNo").onclick = () => close(false);
    root.querySelector(".overlay").addEventListener("mousedown", (e) => { if (e.target.classList.contains("overlay")) close(false); });
    document.addEventListener("keydown", onKey);
    if (onMount) onMount(root);
  });
}

function sumBy(list) { const m = {}; list.forEach((o) => { m[o.customerName] = (m[o.customerName] || 0) + amt(o); }); return Object.entries(m).map(([customerName, total]) => ({ customerName, total })); }
function derive() {
  const o = S.orders;
  const daily = o.filter((x) => x.date === S.dateFilter);
  const month = monthOf(S.dateFilter);
  const monthly = o.filter((x) => monthOf(x.date) === month);
  const dTotal = daily.reduce((s, x) => s + amt(x), 0);
  const dPaid = daily.filter((x) => x.isPaid || x.isCard).reduce((s, x) => s + amt(x), 0);
  const mTotal = monthly.reduce((s, x) => s + amt(x), 0);
  const mPaid = monthly.filter((x) => x.isPaid || x.isCard).reduce((s, x) => s + amt(x), 0);
  const rate = Number(S.config.profitRate); const r = isNaN(rate) ? 20 : rate;
  // 순이익 추정: 원가표에 있는 상품은 (판매가-원가), 없는 상품은 비율로 계산 → 카드 수수료, 택배·포장비(고객별 하루 1건) 차감
  const paidM = monthly.filter((x) => x.isPaid || x.isCard);
  let margin = 0, costHit = 0;
  paidM.forEach((x) => { const key = String(x.productNumber || "").trim(); if (key && key in S.costs) { margin += amt(x) - S.costs[key] * (Number(x.quantity) || 0); costHit++; } else margin += amt(x) * r / 100; });
  const cardFee = paidM.filter((x) => x.isCard).reduce((s, x) => s + amt(x), 0) * (Number(S.config.cardFee) || 0) / 100;
  const ships = new Set(paidM.map((x) => x.date + "|" + x.customerName)).size;
  const shipCost = ships * ((Number(S.config.shipFee) || 0) + (Number(S.config.packFee) || 0));
  const mProfit = Math.round(margin - cardFee - shipCost);
  const profitInfo = { costHit, paidCount: paidM.length, cardFee: Math.round(cardFee), ships, shipCost };
  const scope = S.showAll ? o : daily;
  const grand = {};
  S.custArchive.forEach((a) => { grand[a.customerName] = (grand[a.customerName] || 0) + (Number(a.total) || 0); });
  Object.entries(S.olderTotals || {}).forEach(([n, t]) => { grand[n] = (grand[n] || 0) + t; });
  o.forEach((x) => { grand[x.customerName] = (grand[x.customerName] || 0) + amt(x); });
  let filtered = S.showAll ? o : daily;
  if (S.search) filtered = filtered.filter((x) => String(x.customerName).includes(S.search));
  const sorted = [...filtered].sort((a, b) => cmp(a.customerName, b.customerName) || cmp(a.date, b.date) || (a.createdAt || 0) - (b.createdAt || 0));
  return {
    daily, monthly, sorted, rate, profitInfo,
    metrics: { dTotal, dPaid, dUnpaid: dTotal - dPaid, mTotal, mPaid, mProfit },
    dailyCust: sumBy(daily),
    buyPaid: (() => { const m = {}; scope.forEach((x) => { const r = m[x.customerName] || (m[x.customerName] = { customerName: x.customerName, total: 0, paid: 0 }); const a = amt(x); r.total += a; if (x.isPaid || x.isCard) r.paid += a; }); return Object.values(m); })(),
    paidCust: sumBy(scope.filter((x) => x.isPaid)),
    unpaidCust: sumBy(scope.filter((x) => !x.isPaid && !x.isCard)),
    monthlyCust: sumBy(monthly),
    grandCust: Object.entries(grand).map(([customerName, total]) => ({ customerName, total })),
    productScope: S.showAll ? o : daily,
  };
}

const rowTpl = { TBODY: document.createElement("tbody"), DIV: document.createElement("div") };
function patchList(box, items) {
  // items: [{ key, html }] — 같은 줄은 그대로 두고, 바뀐 줄만 새로 만들고, 순서만 맞춰요
  const old = new Map();

      if (el) el.replaceWith(n); el = n;
    }
    const want = prev ? prev.nextSibling : box.firstChild;
    if (want !== el) box.insertBefore(el, want);
    prev = el;
  }
  old.forEach((el) => el.remove());
}

function openTrash() {

    const list = [...S.trash].sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));

          <div class="row" style="gap:6px;flex-wrap:nowrap"><button type="button" class="btn sm primary" data-tr="restore" data-id="${esc(t.id)}"><span class="always" style="display:inline">↩ 되돌리기</span></button><button type="button" class="ib" data-tr="purge" data-id="${esc(t.id)}" title="완전히 지우기" style="color:var(--danger)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>`).join("")}</div>
        <div class="row" style="margin-top:10px;gap:6px"><button type="button" class="btn sm" data-tr="restoreall"><span class="always" style="display:inline">↩ 모두 되돌리기</span></button><button type="button" class="btn sm danger" data-tr="empty"><span class="always" style="display:inline">휴지통 비우기</span></button></div>`
      : `<p class="muted" style="text-align:center;padding:24px 0;margin:0">휴지통이 비어 있어요</p>`;
  };
  modal({ title: "♻ 휴지통", bodyHTML: `<div id="trBody"></div><div class="muted" style="font-size:11.5px;margin-top:10px;line-height:1.5">※ 「선택 삭제」와 주문 수정 창의 「삭제」로 지운 주문만 들어와요.<br>※ 전체 삭제·초기화·월초기화는 엑셀 백업과 누적 합계 보관으로 대신해요.</div>`, okText: "닫기", cancelText: null,
    onMount: (r) => {
      r.querySelector(".modal").style.maxWidth = "560px"; draw(r);
      let working = false;
      r.querySelector("#trBody").addEventListener("click", async (e) => {
        const b = e.target.closest("[data-tr]"); if (!b || working) return;
        const act = b.dataset.tr; const t = S.trash.find((x) => x.id === b.dataset.id);
        if (act === "empty" && !confirmInline(b, "정말 비울까요? 한 번 더 누르세요")) return;
        working = true;
        try {
          if (act === "restore" && t) { await api.restoreOrders([t]); toast(`${t.customerName}님 주문을 되돌렸어요 ✅`); }
          else if (act === "purge" && t) { await api.purgeTrash([t.id]); toast("완전히 지웠어요"); }
          else if (act === "restoreall") { const all = [...S.trash]; await api.restoreOrders(all); toast(`${all.length}건을 되돌렸어요 ✅`); }

          }
        } catch (err) { console.error(err); toast(errMsg(err), "err"); }
        finally { working = false; api.flush(); setTimeout(() => { if (r.querySelector("#trBody")) draw(r); }, 120); }
      });
    } });
}
function confirmInline(btn, text) {
  if (btn.dataset.armed === "1") return true;
  btn.dataset.armed = "1"; const old = btn.innerHTML; btn.innerHTML = `<span class="always" style="display:inline">${text}</span>`;
  setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ""; btn.innerHTML = old; } }, 3500);
  return false;
}

/* ───────── 백업 ───────── */
function sheetWithTotal(rows, labelCol, sumKeys) {
  const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ [labelCol]: "(없음)" }]);
  if (rows.length && sumKeys.length) {
    const tot = { [labelCol]: "합계" }; sumKeys.forEach((k) => { tot[k] = rows.reduce((s, r) => s + (Number(r[k]) || 0), 0); });
    XLSX.utils.sheet_add_json(ws, [{}, tot], { origin: -1, skipHeader: true });
  }
  return ws;
}
function custSummaryRows(list) {
  const m = {};
  list.forEach((o) => { const r = m[o.customerName] || (m[o.customerName] = { 고객명: o.customerName, 주문수: 0, 합계: 0, 입금: 0, 미입금: 0 }); const a = amt(o); r.주문수++; r.합계 += a; if (o.isPaid || o.isCard) r.입금 += a; else r.미입금 += a; });
  return Object.values(m).sort((a, b) => cmp(a.고객명, b.고객명));
}
function productRows(list) {
  const m = {}; list.forEach((o) => { if (!o.productNumber) return; const k = o.size ? `${o.productNumber} / ${o.size}` : o.productNumber; m[k] = (m[k] || 0) + (Number(o.quantity) || 0); });
  return Object.entries(m).sort((a, b) => cmp(a[0], b[0])).map(([k, v], i) => ({ 순번: i + 1, "상품/품목": k, 수량: v }));
}
async function backupDay() {

  const wb = ordersWorkbook(list, "주문");
  XLSX.utils.book_append_sheet(wb, sheetWithTotal(custSummaryRows(list), "고객명", ["주문수", "합계", "입금", "미입금"]), "고객별");
  XLSX.utils.book_append_sheet(wb, sheetWithTotal(productRows(list), "상품/품목", ["수량"]), "상품별");

}

function custStats(name) {
  const mine = S.orders.filter((o) => o.customerName === name);
  const month = monthOf(S.dateFilter);
  const arch = S.custArchive.find((c) => c.customerName === name);
  const grand = (arch ? Number(arch.total) || 0 : 0) + ((S.olderTotals || {})[name] || 0) + mine.reduce((s, o) => s + amt(o), 0);
  const monthTotal = mine.filter((o) => monthOf(o.date) === month).reduce((s, o) => s + amt(o), 0);
  const unpaid = mine.filter((o) => !o.isPaid && !o.isCard).reduce((s, o) => s + amt(o), 0);
  const last = mine.map((o) => o.date).sort().pop() || "";
  return { mine, grand, monthTotal, unpaid, last };
}

function readSheetRows(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    const isCsv = /\.csv$/i.test(file.name || "");
    fr.onload = () => {
      try {
        // CSV는 글자 그대로 읽어요 (26-11-19 같은 값이 날짜로 바뀌지 않게, 한글 깨지지 않게)
        const wb = isCsv ? XLSX.read(String(fr.result).replace(/^\uFEFF/, ""), { type: "string", raw: true }) : XLSX.read(new Uint8Array(fr.result), { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]]; resolve(XLSX.utils.sheet_to_json(ws, { defval: "", raw: true }));
      } catch (e) { reject(e); }
    };
    fr.onerror = reject; if (isCsv) fr.readAsText(file, "utf-8"); else fr.readAsArrayBuffer(file);
  });
}
const pick = (row, ...keys) => { for (const k of keys) if (row[k] !== undefined && row[k] !== "") return row[k]; return ""; };
const yes = (v) => { const s = String(v).trim(); return v === true || ["✅", "O", "o", "Y", "y", "입금", "예", "TRUE", "true", "True", "t", "1", "카드", "✔"].includes(s); };
function normDate(v) {
  if (typeof v === "number" && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return `${String(d.getUTCFullYear()).slice(2)}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const s = String(v).trim().replace(/[./]/g, "-").replace(/\s+/g, "");
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1].slice(2)}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{2})-(\d{1,2})-(\d{1,2})$/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  return "";
}
const sig = (o) => [o.date, o.customerName, o.productNumber, o.size || "", Number(o.quantity), Number(o.unitPrice)].join("|");
async function importOrders(file, preRows) {
  await ensureAllLoaded("겹치는 주문을 찾으려고 모든 주문 불러오는 중");
  let rows = preRows; if (!rows) { try { rows = await readSheetRows(file); } catch { toast("엑셀 파일을 읽지 못했어요", "err"); return; } }
  const parsed = [], bad = [];
  rows.forEach((r, i) => {
    const name = String(pick(r, "고객명", "고객", "이름", "customer_name")).trim();
    if (!name) return; // 정산 요약 줄 등
    const rawDate = pick(r, "날짜", "주문일", "일자", "date");
    const date = normDate(rawDate);
    if (!date) { if (/^(정산|총합계|입금액|미입금액|합계)/.test(String(rawDate).trim()) || /^[\d,.\s-]+$/.test(name)) return; bad.push(i + 2); return; }
    const ca = Date.parse(String(pick(r, "created_at")).replace(" ", "T"));
    parsed.push({ date, customerName: name, productNumber: String(pick(r, "상품/품목", "상품", "품목", "상품번호", "product_number")).trim(), size: String(pick(r, "사이즈", "옵션", "size")).trim(),
      quantity: Math.max(1, Number(pick(r, "수량", "quantity")) || 1), unitPrice: Math.max(0, Number(String(pick(r, "단가", "가격", "unit_price")).replace(/[^\d.-]/g, "")) || 0), _ca: isNaN(ca) ? 0 : ca,
      isPaid: yes(pick(r, "입금여부", "입금", "is_paid")) || yes(pick(r, "카드", "is_card")), isCard: yes(pick(r, "카드", "is_card")) });
  });
  if (!parsed.length) { toast("불러올 주문을 찾지 못했어요. '고객명'과 '날짜' 칸이 있는 엑셀인지 확인해 주세요", "err", 5000); return; }
  const existing = new Map(); S.orders.forEach((o) => { const k = sig(o); existing.set(k, (existing.get(k) || 0) + 1); });
  const fresh = []; let dup = 0;
  parsed.forEach((o) => { const k = sig(o); const n = existing.get(k) || 0; if (n > 0) { existing.set(k, n - 1); dup++; } else fresh.push(o); });
  const dates = fresh.map((o) => o.date).sort();
  const total = fresh.reduce((s, o) => s + amt(o), 0);
  const ok = await modal({ title: "📥 주문 불러오기", okText: fresh.length ? `${fresh.length}건 불러오기` : "닫기", cancelText: fresh.length ? "취소" : null,
    message: `파일에서 주문 ${parsed.length}건을 찾았어요.\n· 새로 넣을 주문: ${fresh.length}건${fresh.length ? ` (${dates[0]} ~ ${dates[dates.length - 1]})` : ""}\n· 합계: ${won(total)}\n· 이미 있는 똑같은 주문(건너뜀): ${dup}건${bad.length ? `\n· 날짜를 못 읽은 줄(건너뜀): ${bad.length}줄` : ""}` });
  if (!ok || !fresh.length) return;
  const base = Date.now();
  fresh.sort((a, b) => (a._ca || 0) - (b._ca || 0));
  try { await api.addOrders(fresh.map((o, i) => ({ ...o, createdAt: o._ca || base + i })), "주문 불러오는 중"); toast(`주문 ${fresh.length}건을 불러왔어요 ✅`, "ok", 3500); S.showAll = true; }
  catch (e) { console.error(e); toast(errMsg(e) + " (일부만 들어갔을 수 있어요. 다시 불러오면 이미 들어간 주문은 건너뛰어요)", "err", 6000); }
  finally { busy(null); api.flush(); }
}

async function importCosts(file) {
  let rows; try { rows = await readSheetRows(file); } catch { toast("엑셀 파일을 읽지 못했어요", "err"); return; }
  const m = {}; let skipped = 0;
  rows.forEach((r) => {
    const p = String(pick(r, "상품/품목", "상품", "품목", "상품명", "상품번호")).trim();
    const raw = pick(r, "원가", "매입가", "원가(1개)", "단가");
    if (!p || p.startsWith("예)")) return;
    if (raw === "") { skipped++; return; }
    const c = Number(String(raw).replace(/[^\d.-]/g, ""));
    if (isNaN(c) || c < 0) { skipped++; return; }
    m[p] = c;
  });
  const list = Object.entries(m);
  if (!list.length) { toast("원가를 찾지 못했어요. '상품/품목'과 '원가' 칸이 있는 엑셀인지 확인해 주세요", "err", 5000); return; }
  const added = list.filter(([p]) => !(p in S.costs)).length;
  const changed = list.filter(([p, c]) => p in S.costs && S.costs[p] !== c).length;
  const same = list.length - added - changed;
  const todo = list.filter(([p, c]) => S.costs[p] !== c);
  const ok = await modal({ title: "📥 원가표 올리기", okText: todo.length ? `${todo.length}개 저장` : "닫기", cancelText: todo.length ? "취소" : null,
    message: `파일에서 상품 ${list.length}개를 찾았어요.\n· 새로 추가: ${added}개\n· 원가 바뀜: ${changed}개\n· 그대로(건너뜀): ${same}개${skipped ? `\n· 원가 칸이 비어 있어 건너뜀: ${skipped}개` : ""}\n\n엑셀에 없는 상품의 원가는 지우지 않고 그대로 둬요.` });
  if (!ok || !todo.length) return;
  try { busy("원가 저장 중"); await api.setCosts(todo); toast(`원가 ${todo.length}개를 저장했어요 ✅`, "ok", 3500); }
  catch (e) { console.error(e); toast(errMsg(e), "err"); }
  finally { busy(null); api.flush(); }
}
function pickFile(accept, cb) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = accept; inp.style.display = "none";

}

async function importArchive(rows) {
  // 예전 프로그램의 customer_totals_archive (지난 누적 기록) → 그대로 옮겨요
  const m = {};
  rows.forEach((r) => { const n = String(pick(r, "customer_name")).trim(); const t = Number(String(pick(r, "total")).replace(/[^\d.-]/g, "")); if (n && !isNaN(t)) m[n] = (m[n] || 0) + t; });
  const list = Object.entries(m);
  if (!list.length) { toast("누적 기록을 찾지 못했어요", "err"); return; }
  const sum = list.reduce((s, [, t]) => s + t, 0);
  const ok = await modal({ title: "📥 지난 누적 기록 옮기기", okText: `${list.length}명 저장`,
    message: `예전 앱의 「지난 누적 기록」 ${list.length}명 (합계 ${won(sum)})을 찾았어요.\n\n이 금액은 이미 지운(월초기화한) 주문들의 합계예요.\n저장하면 「고객별 총 누적 합계」 = 지난 기록 + 지금 주문 으로 예전 앱과 똑같아져요.\n※ 같은 고객의 기존 기록은 이 값으로 바뀌어요 (두 번 해도 두 번 더해지지 않아요).` });
  if (!ok) return;
  try { busy("누적 기록 저장 중"); await api.upsertCust(list.map(([customerName, total]) => ({ customerName, total }))); toast(`고객 ${list.length}명의 지난 누적 기록을 옮겼어요 ✅`, "ok", 3500); }
  catch (e) { console.error(e); toast(errMsg(e), "err"); }
  finally { busy(null); }
}
async function importSalesArchive(rows) {
  const list = rows.map((r) => ({ monthKey: String(pick(r, "month_key")).trim(), day: Number(pick(r, "day")), total: Number(String(pick(r, "total")).replace(/[^\d.-]/g, "")) }))
    .filter((r) => /^\d{4}-\d{2}$/.test(r.monthKey) && r.day >= 1 && r.day <= 31 && !isNaN(r.total));
  if (!list.length) { toast("매출표 기록을 찾지 못했어요", "err"); return; }
  const ok = await modal({ title: "📥 매출표 기록 옮기기", okText: `${list.length}일 저장`,
    message: `예전 앱의 매출표(그래프) 기록 ${list.length}일치를 찾았어요.\n(${list.map((r) => r.monthKey).sort()[0]} ~ ${list.map((r) => r.monthKey).sort().pop()})\n같은 날짜 기록은 이 값으로 바뀌어요.` });
  if (!ok) return;
  try { busy("매출표 저장 중"); await api.upsertSales(list); toast(`매출표 ${list.length}일치를 옮겼어요 ✅`, "ok", 3500); }
  catch (e) { console.error(e); toast(errMsg(e), "err"); }
  finally { busy(null); }
}
async function importAuto(file) {
  let rows; try { rows = await readSheetRows(file); } catch { toast("파일을 읽지 못했어요. 엑셀(.xlsx)이나 CSV 파일인지 확인해 주세요", "err", 4500); return; }
  const keys = new Set(rows.slice(0, 5).flatMap((r) => Object.keys(r)));
  const has = (...k) => k.every((x) => keys.has(x));
  if (has("month_key", "day", "total")) return importSalesArchive(rows);
  if (has("customer_name", "total") && !keys.has("date")) return importArchive(rows);
  if ((keys.has("고객명") || keys.has("customer_name")) && (keys.has("날짜") || keys.has("date"))) return importOrders(file, rows);
  if (keys.has("고객명") && (keys.has("합계") || keys.has("총합계"))) return importTotals(file, rows);
  toast("어떤 파일인지 알아보지 못했어요. 주문 엑셀·누적 합계 엑셀·예전 앱 CSV 중 하나를 골라 주세요", "err", 5000);
}

async function archiveSales(list) {
  const mk = curMonthKey(); const m = {};

  busy("매출표 보관 중");
  await api.upsertSales(Object.entries(m).map(([d, t]) => ({ monthKey: mk, day: Number(d), total: (ex[d] || 0) + t })));
}

function idleExpired() { const last = Number(lsGet(ACT_KEY, 0)) || 0; return last > 0 && Date.now() - last > IDLE_MS; }
function watchIdle() {
  ["pointerdown", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, () => markActive(false), { passive: true }));
  setInterval(async () => {
    if (!started || !idleExpired()) return;
    try { if (channel) await sb.removeChannel(channel); } catch {}
    lsSet("lo-idle-out", 1); await sb.auth.signOut(); location.reload();
  }, 5 * 60 * 1000);
}
async function showPwWarn(session) {
  try {
    const u = (session && session.user) || ((await sb.auth.getUser()).data || {}).user;
    const done = u && u.user_metadata && u.user_metadata.pw_updated_at;
    let el = $("#pwWarn");
    if (done || sessionStorage.getItem("lo-pw-later")) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement("div"); el.id = "pwWarn"; el.className = "pwwarn";
      el.innerHTML = `<span>🔒 <b>비밀번호를 바꿔 주세요.</b> 지금 비밀번호는 짧아서 다른 사람이 맞힐 수 있어요. 8자 이상(영문+숫자)으로 바꾸면 이 안내가 사라져요.</span>
        <span class="row" style="gap:6px;margin-left:auto"><button type="button" class="btn sm primary" id="pwNow"><span class="always" style="display:inline">🔑 지금 바꾸기</span></button><button type="button" class="btn sm" id="pwLater"><span class="always" style="display:inline">나중에</span></button></span>`;
      document.querySelector("header").after(el);
      el.querySelector("#pwNow").addEventListener("click", () => openPwChange());
      el.querySelector("#pwLater").addEventListener("click", () => { sessionStorage.setItem("lo-pw-later", "1"); el.remove(); });
    }
  } catch (e) { console.warn(e); }
}
async function openPwChange() {
  const body = `<p class="muted" style="font-size:12.5px;margin:0 0 10px">8자 이상, 영문과 숫자를 함께 넣어 주세요. 바꾼 뒤에는 다른 기기에서도 새 비밀번호로 로그인해요.</p>
    <div class="field"><label>지금 비밀번호</label><input class="inp" id="pwCur" type="password" autocomplete="current-password"></div>
    <div class="field" style="margin-top:8px"><label>새 비밀번호</label><input class="inp" id="pwNew" type="password" autocomplete="new-password"></div>
    <div class="field" style="margin-top:8px"><label>새 비밀번호 한 번 더</label><input class="inp" id="pwNew2" type="password" autocomplete="new-password"></div>
    <div id="pwErr" class="lgerr" style="margin-top:8px"></div>`;
  const res = await modal({ title: "🔑 비밀번호 변경", bodyHTML: body, okText: "바꾸기",
    onMount: (r) => setTimeout(() => { const i = r.querySelector("#pwCur"); i && i.focus(); }, 30),
    validate: () => {
      const cur = $("#pwCur").value, n1 = $("#pwNew").value, n2 = $("#pwNew2").value, err = $("#pwErr");
      if (!cur) { err.textContent = "지금 비밀번호를 넣어 주세요."; return false; }
      const msg = pwRuleMsg(n1, S.loginId); if (msg) { err.textContent = msg; return false; }
      if (n1 !== n2) { err.textContent = "새 비밀번호 두 칸이 서로 달라요."; return false; }
      if (n1 === cur) { err.textContent = "지금과 다른 비밀번호로 만들어 주세요."; return false; }
      return { cur, n1 };
    } });
  if (!res) return;
  busy("비밀번호 바꾸는 중");
  try {
    const { data: ud } = await sb.auth.getUser(); const email = ud && ud.user && ud.user.email;
    if (!email) throw new Error("로그인 정보를 찾지 못했어요");
    const chk = await sb.auth.signInWithPassword({ email, password: authPw(res.cur) });
    if (chk.error) { busy(null); toast("지금 비밀번호가 맞지 않아요", "err"); return; }
    const { error } = await sb.auth.updateUser({ password: res.n1, data: { pw_updated_at: new Date().toISOString() } });
    if (error) {
      busy(null);
      toast(/reauth/i.test(error.message) ? "보안 확인이 필요해요. 로그아웃 후 다시 로그인해서 바꿔 주세요." : /same/i.test(error.message) ? "지금과 다른 비밀번호로 만들어 주세요." : "비밀번호를 바꾸지 못했어요: " + error.message, "err", 5000);
      return;
    }
    busy(null); const w = $("#pwWarn"); if (w) w.remove();
    toast("비밀번호를 바꿨어요. 다음부터 새 비밀번호로 로그인해요 🔒", "ok", 4500);
  } catch (e) { busy(null); console.error(e); toast(errMsg(e), "err"); }
}

const idToEmail = (id) => { const s = String(id).trim().toLowerCase(); return s.includes("@") ? s : `${s}@${CFG.loginDomain || "liveorder.local"}`; };
function showLogin(msg = "") {
  $("#loading").classList.add("hide"); $("#app").classList.add("hide"); document.querySelector("header").classList.add("hide");
  $("#login").classList.remove("hide");
  $("#lgErr").textContent = msg;
  setTimeout(() => $("#lgId").focus(), 50);
}
function setLive(state) { S.live = state; render(); }
async function startApp(session) {
  if (started) return; started = true;
  $("#login").classList.add("hide"); document.querySelector("header").classList.remove("hide"); $("#loading").classList.remove("hide");
  try {
    const m = await q(sb.from("members").select("shop_id, role, login_id").eq("user_id", session.user.id).maybeSingle());
    if (!m) { started = false; await sb.auth.signOut(); showLogin("이 계정은 아직 업체에 연결되지 않았어요. 관리자에게 문의해 주세요."); return; }
    SHOP = m.shop_id; S.role = m.role; S.isOwner = m.role === "owner"; S.loginId = m.login_id || session.user.email.split("@")[0];
    await Promise.all(TABLES.map((t) => loaders[t]()));
  } catch (e) { console.error(e); started = false; showLogin("데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 로그인해 주세요."); return; }
  S.mode = "db"; afterFirstOrders(); render();
  markActive(true); showPwWarn(session);
  // 30일 지난 휴지통 정리
  const old = S.trash.filter((t) => Date.now() - (t.deletedAt || 0) > TRASH_DAYS * 86400000);
  if (old.length) api.purgeTrash(old.map((t) => t.id)).catch(() => {});
  // 실시간 반영: 다른 기기에서 바꾼 내용이 바로 보여요
  channel = sb.channel("live-order-" + SHOP);
  TABLES.forEach((t) => channel.on("postgres_changes", { event: "*", schema: "public", table: t }, (p) => (t === "orders" ? patchOrderEvent(p) : touch(t))));
  channel.subscribe((status) => {
    if (status === "SUBSCRIBED") { if (S.live === "off") TABLES.forEach((t) => touch(t)); setLive("on"); }
    else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") setLive("off");
  });
  // 화면으로 돌아오면 최신 내용으로
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && SHOP) TABLES.forEach((t) => touch(t)); });
}
async function logout() {
  if (!(await modal({ title: "로그아웃할까요?", message: "다시 들어오려면 아이디와 비밀번호가 필요해요.", okText: "로그아웃" }))) return;
  try { if (channel) await sb.removeChannel(channel); } catch {}
  await sb.auth.signOut();
  location.reload();
}
async function boot() {
  if (lsGet("lo-theme", "dark") === "light") document.body.classList.add("light");
  $("#lgTitle").textContent = (CFG.title || "") + " LIVE ORDER";
  document.title = (CFG.title || "라이브") + " 오더";
  bind();
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) { showLogin("⚙ 아직 서버 설정이 안 됐어요. index.html 위쪽 설정 칸에 수파베이스 주소와 키를 넣어 주세요."); $("#lgBtn").disabled = true; return; }
  if (!window.supabase || !window.supabase.createClient) { showLogin("서버 연결 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  $("#lgForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = $("#lgId").value.trim(), pw = $("#lgPw").value;
    if (!id || !pw) { $("#lgErr").textContent = "아이디와 비밀번호를 입력해 주세요."; return; }
    const left = lockLeft();
    if (left > 0) { $("#lgErr").textContent = `로그인을 여러 번 틀려서 잠시 막아 두었어요. ${left}초 뒤에 다시 해 주세요.`; return; }
    $("#lgBtn").disabled = true; $("#lgErr").textContent = "";
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: idToEmail(id), password: authPw(pw) });
      if (error) { if (/invalid/i.test(error.message)) noteFail(); $("#lgErr").textContent = /invalid/i.test(error.message) ? "아이디 또는 비밀번호가 맞지 않아요." : "로그인하지 못했어요. 잠시 후 다시 시도해 주세요."; return; }
      $("#lgPw").value = ""; clearFail(); lsSet("lo-idle-out", 0); markActive(true);
      await startApp(data.session);
    } catch (err) { console.error(err); $("#lgErr").textContent = "인터넷 연결을 확인해 주세요."; }
    finally { $("#lgBtn").disabled = false; }
  });
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && started) location.reload(); });
  watchIdle();
  const { data } = await sb.auth.getSession();
  if (data && data.session && idleExpired()) { await sb.auth.signOut(); showLogin("12시간 동안 쓰지 않아서 안전을 위해 로그아웃했어요. 다시 로그인해 주세요."); return; }
  if (data && data.session) startApp(data.session);
  else showLogin(Number(lsGet("lo-idle-out", 0)) ? "12시간 동안 쓰지 않아서 안전을 위해 로그아웃했어요. 다시 로그인해 주세요." : "");
}
boot();
})();
</script>
